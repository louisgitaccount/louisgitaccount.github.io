<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>will you marry me</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body { background: #ffe8f0; }
    .scene {
      width: 100%;
      min-height: 100svh;
      background: #ffe8f0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 1.5rem;
      position: relative;
      overflow: hidden;
    }
    .hearts-bg { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
    .fh { position: absolute; animation: floatUp linear infinite; }
    @keyframes floatUp {
      0%   { transform: translateY(110vh); opacity: 0; }
      8%   { opacity: 0.6; }
      92%  { opacity: 0.5; }
      100% { transform: translateY(-10vh); opacity: 0; }
    }
    .ring { font-size: 5rem; display: block; text-align: center; animation: pulse 1.6s ease-in-out infinite; margin-bottom: 1rem; }
    @keyframes pulse {
      0%,100% { transform: scale(1) rotate(-4deg); }
      50%      { transform: scale(1.1) rotate(4deg); }
    }
    .question { font-family: Georgia, serif; font-size: 2rem; font-weight: bold; color: #111; text-align: center; line-height: 1.25; margin-bottom: 0.3rem; }
    .question-sub { font-family: Georgia, serif; font-size: 1rem; color: #111; text-align: center; font-style: italic; margin-bottom: 0.6rem; }
    .sub { font-size: 1.05rem; color: #111; text-align: center; margin-bottom: 2.5rem; line-height: 1.6; font-weight: bold; }
    .btn-yes {
      display: block; width: 100%; max-width: 260px;
      background: #ff6b9d; color: #111111; border: none;
      border-radius: 999px; padding: 17px; font-size: 1.25rem;
      font-family: Georgia, serif; font-weight: bold; cursor: pointer;
      margin: 0 auto; touch-action: manipulation; -webkit-tap-highlight-color: transparent;
      position: relative; z-index: 2;
    }
    #noBtn {
      position: fixed; background: #ffe8f0; color: #111111;
      border: 2px solid #ff6b9d; border-radius: 999px; padding: 12px 0;
      font-size: 1rem; font-family: Georgia, serif; font-weight: bold;
      cursor: pointer; touch-action: none; z-index: 999; width: 260px; text-align: center;
    }
    .success { display: none; flex-direction: column; align-items: center; gap: 1.2rem; text-align: center; animation: popIn 0.5s cubic-bezier(.34,1.56,.64,1) both; }
    @keyframes popIn { from { opacity: 0; transform: scale(0.7); } to { opacity: 1; transform: scale(1); } }
    .success-emoji { font-size: 5rem; }
    .success-text { font-family: Georgia, serif; font-size: 2rem; color: #111; line-height: 1.3; font-weight: bold; }
    .success-sub { font-size: 1rem; color: #333; font-style: italic; }
  </style>
</head>
<body>
  <div class="scene">
    <div class="hearts-bg" id="hbg"></div>
    <div id="proposal" style="width:100%;max-width:320px;margin:0 auto;position:relative;z-index:2;text-align:center">
      <span class="ring">💍</span>
      <div class="question">will you marry me</div>
      <div class="question-sub">(auf süß aber)</div>
      <div class="sub">ya habibti, kein Stress aber 😅💍</div>
      <button class="btn-yes" onclick="sayYes()">Yes! 💖</button>
      <div id="noAnchor" style="margin-top:1rem;height:50px;"></div>
    </div>
    <div class="success" id="success">
      <div class="success-emoji">🥂💍🎉</div>
      <div class="success-text">Yaaaay!<br>Ich liebe dich!</div>
      <div class="success-sub">Das schönste Abenteuer<br>eures Lebens beginnt 🌸</div>
    </div>
  </div>

  <button id="noBtn">No 😊</button>

  <script>
    const syms = ['💖','🌸','🌹','💕','✨','🦋','💗'];
    const hbg = document.getElementById('hbg');
    function addHeart(fast) {
      const h = document.createElement('span');
      h.className = 'fh';
      h.textContent = syms[Math.floor(Math.random() * syms.length)];
      h.style.left = (Math.random() * 100) + '%';
      h.style.fontSize = (0.9 + Math.random() * 1.3) + 'rem';
      h.style.animationDuration = (fast ? 2 + Math.random() * 2 : 4 + Math.random() * 5) + 's';
      h.style.animationDelay = (Math.random() * (fast ? 0.5 : 6)) + 's';
      hbg.appendChild(h);
    }
    for (let i = 0; i < 16; i++) addHeart(false);

    const noBtn = document.getElementById('noBtn');
    const msgs = ['Nein 😅','Nope 🙈','Niemals 😜','Nein nein! 😂','Catch me! 🏃','Haha nein 😝','No way! 🤪'];
    let attempts = 0;

    function positionAtStart() {
      const anchor = document.getElementById('noAnchor');
      const rect = anchor.getBoundingClientRect();
      const btnW = noBtn.offsetWidth;
      noBtn.style.left = (rect.left + rect.width / 2 - btnW / 2) + 'px';
      noBtn.style.top  = rect.top + 'px';
    }

    function placeNoBtn() {
      const bw = noBtn.offsetWidth || 260;
      const bh = noBtn.offsetHeight || 50;
      const m = 16;
      const x = m + Math.random() * (window.innerWidth - bw - m * 2);
      const y = m + Math.random() * (window.innerHeight - bh - m * 2);
      noBtn.style.left = x + 'px';
      noBtn.style.top  = y + 'px';
    }

    function runAway() {
      attempts++;
      noBtn.textContent = msgs[Math.min(attempts - 1, msgs.length - 1)];
      placeNoBtn();
    }

    noBtn.addEventListener('touchstart', function(e) { e.preventDefault(); runAway(); }, { passive: false });
    noBtn.addEventListener('mouseover', runAway);
    setTimeout(positionAtStart, 120);

    function sayYes() {
      document.getElementById('proposal').style.display = 'none';
      noBtn.style.display = 'none';
      const s = document.getElementById('success');
      s.style.display = 'flex';
      for (let i = 0; i < 28; i++) addHeart(true);
    }
  </script>
</body>
</html>
